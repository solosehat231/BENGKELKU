name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Prepare Debug Keystore and Env
      run: |
        # Buat debug keystore jika belum ada agar gradle tidak error
        if [ ! -f "debug.keystore" ]; then
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi
        
        # Buat file .env dummy untuk secrets gradle plugin
        touch .env
        echo "GEMINI_API_KEY=mock_key_for_ci_build" >> .env
        echo "MAPS_API_KEY=mock_maps_key" >> .env

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon -x test -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BengkelKu-App-Debug
        path: app/build/outputs/apk/debug/*.apk
