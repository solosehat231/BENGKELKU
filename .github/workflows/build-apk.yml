name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate debug keystore and local env
      run: |
        # Restore or create debug keystore
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        
        # Create .env and .env.example
        touch .env .env.example
        echo "GEMINI_API_KEY=dummy_key_build" > .env
        echo "GEMINI_API_KEY=dummy_key_build" > .env.example

    - name: Build APK with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        arguments: assembleDebug -x test -x lint --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BengkelKu-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
