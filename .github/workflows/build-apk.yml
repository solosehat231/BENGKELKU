name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate debug keystore and local env
      run: |
        # Buat debug.keystore jika belum ada
        if [ ! -f "debug.keystore" ]; then
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi
        
        # Buat file environment dummy
        touch .env .env.example
        echo "GEMINI_API_KEY=dummy_key_build" > .env
        echo "GEMINI_API_KEY=dummy_key_build" > .env.example
        chmod +x gradlew || true

    - name: Build Debug APK with Gradle Wrapper
      run: ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BengkelKu-App-Debug
        path: app/build/outputs/apk/debug/*.apk
